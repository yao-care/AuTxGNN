# AuTxGNN - Australia TGA ARTG Field Configuration

country_code: AU
language: en
# 本站藥品清單實際是 PBS 給付品項（data/raw/pbs_data.zip，品項碼如 2019G），不是 TGA ARTG 編號；
# 報告引用時如實標示來源（2026-10-12 盤點 J 項）
regulatory_agency: "PBS (Australia)"

# Data source information
data_source:
  name: "Pharmaceutical Benefits Scheme (PBS) Schedule"
  url: "https://data-api.health.gov.au/pbs/api/v3/items"
  format: "CSV"
  download_required: false
  notes: |
    PBS public API (Australian Department of Health): https://data.pbs.gov.au/api/api-public.html
    Downloaded weekly by scripts/license_adapter.py; this is a subsidy list, not the TGA ARTG register.

# Field mapping (based on ARTG export format)
# These may need adjustment based on actual export format
field_mapping:
  license_id: "ARTG_ID"           # ARTG Number
  brand_name_local: "Product_Name"
  brand_name_en: "Product_Name"
  ingredients: "Active_Ingredients"
  indication: null                 # ARTG may not have indication field
  dosage_form: "Dosage_Form"
  status: "Status"
  sponsor: "Sponsor"

# Status values indicating withdrawn/cancelled
withdrawn_statuses:
  - "Cancelled"
  - "Suspended"

# Indication settings
has_indication: false  # ARTG export may not include indications
